[project]
name = "sentineldesk"
version = "0.1.0"
description = "SentinelDesk: multilingual incident triage + Gemma-grounded resolution copilot"
authors = [
    { name = "Aayam Raj Shakya", email = "144458398+aayamrajshakya@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
    "huggingface-hub>=2.4.0",
    "lingua-language-detector>=2.2.0",
    "mlx-lm>=0.32.2 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
